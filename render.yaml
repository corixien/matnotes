# Render blueprint for the sync server (Free plan; spins down when idle, the first request afterwards is slow).
services:
  - type: web
    name: matnotes-sync
    runtime: node
    plan: free
    rootDir: server
    # the web app (web/) is built here too and served by the same service from /
    buildCommand: npm ci --omit=dev && cd ../web && npm ci && node scripts/fetch-dictionaries.mjs && node scripts/fetch-engine.mjs && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - server/**
        - web/**
        - app/src/main/res/values*/strings.xml
    envVars:
      - key: DATABASE_URL        # Neon pooled connection string of the matnotes-sync project (never commit)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
